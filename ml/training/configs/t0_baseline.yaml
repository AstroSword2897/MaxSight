# MaxSight Training Configuration: T0_BASELINE_CNN
# Baseline ResNet50 + FPN, Tier 1 heads only
# Target: Cloud GPU training, ~29M parameters

schema_version: "1.0.0"

# Model Configuration
model:
  tier: "T0_BASELINE_CNN"
  num_classes: 622  # Full COCO_BASE + ACCESSIBILITY vocabulary
  use_se_attention: false
  use_cbam_attention: false
  use_hybrid_backbone: false
  use_dynamic_conv: false
  use_cross_task_attention: false
  use_cross_modal_attention: false
  use_temporal_modeling: false
  use_retrieval: false

# Data Configuration
data:
  train_annotation_file: "datasets/cleaned_splits/maxsight_train.json"
  val_annotation_file: "datasets/cleaned_splits/maxsight_val.json"
  test_annotation_file: "datasets/cleaned_splits/maxsight_test.json"
  image_dir: "datasets/coco_raw"  # Auto-detects train2017/val2017
  audio_dir: null
  batch_size: 32
  num_workers: 8  # Increased for GPU-bound training
  pin_memory: true
  max_objects: 10
  condition_mode: null  # No condition-specific augmentation for baseline
  tag_lighting_metadata: true
  lighting_pixel_augmentation: false
  use_weighted_sampling: false

# Training Configuration
# AdamW only - ProductionTrainLoop and create_loss_fn do not use SGD/momentum.
training:
  num_epochs: 100
  learning_rate: 1.5e-3  # Higher LR acceptable for smaller 29M model
  weight_decay: 0.05
  optimizer: "AdamW"
  scheduler_type: "cosine"
  min_lr: 1e-6
  warmup_epochs: 5
  gradient_clip_norm: 1.0
  mixed_precision: false  # FP32 only
  gradient_accumulation_steps: 1
  freeze_backbone: false
  freeze_backbone_epochs: 0
  early_stopping_patience: 10
  early_stopping_metric: "val_loss"
  use_compile: false
  use_gradient_checkpointing: false

distributed:
  backend: none
  world_size: 1
  local_rank: 0

# Loss Configuration
# Trimmed to active heads in create_loss_fn (objectness, classification, box,
# distance, urgency). Heads still aspirational at the model level are omitted
# until ml/training/losses.py wires them.
loss:
  use_gradnorm: false  # Simple loss for baseline
  temporal_supervision: false
  loss_weights:
    objectness: 1.0
    classification: 1.2
    box: 3.0
    distance: 0.7
    urgency: 1.5

# Validation Configuration
validation:
  val_check_interval: 0.5  # Validate every 0.5 epochs
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"

# Checkpointing
checkpoint:
  save_dir: "checkpoints/t0_baseline"
  save_last: true
  save_every_n_epochs: 10

# Logging
logging:
  log_dir: "logs/t0_baseline"
  log_every_n_steps: 50
  tensorboard: true

# Dataset version gate (ties model<->dataset<->config in provenance)
dataset:
  dataset_id: "maxsight-coco-cleaned"
  dataset_version: "v1"
  require_match: false

# Device
device: "auto"  # auto, cuda, cpu
seed: 42
