# MaxSight Training Configuration: T5_TEMPORAL
# Temporal modeling (video), All features enabled
# Target: Cloud GPU training, ~320M parameters

schema_version: "1.0.0"

# Model Configuration
model:
  tier: "T5_TEMPORAL"
  num_classes: 622  # Full COCO_BASE + ACCESSIBILITY vocabulary
  use_se_attention: true
  use_cbam_attention: true
  use_hybrid_backbone: true
  use_dynamic_conv: true
  use_cross_task_attention: true
  use_cross_modal_attention: true
  use_temporal_modeling: true  # Temporal modeling enabled
  use_retrieval: true

# Data Configuration
data:
  train_annotation_file: "datasets/cleaned_splits/maxsight_train.json"
  val_annotation_file: "datasets/cleaned_splits/maxsight_val.json"
  test_annotation_file: "datasets/cleaned_splits/maxsight_test.json"
  image_dir: "datasets/coco_raw"
  audio_dir: null
  batch_size: 4  # Very small batch for largest model
  num_workers: 8  # Increased for GPU-bound training (model is compute-bound)
  pin_memory: true
  max_objects: 10
  condition_mode: null
  tag_lighting_metadata: true
  lighting_pixel_augmentation: false
  use_weighted_sampling: false

# Training Configuration
training:
  num_epochs: 150
  learning_rate: 7.5e-5  # Sweet spot for 300-400M params at batch 32
  weight_decay: 0.05  # Higher to prevent overfitting in expressive model
  optimizer: "AdamW"
  scheduler_type: "cosine"
  min_lr: 1e-6  # Prevent late-stage collapse when temporal heads overfit
  warmup_epochs: 20  # Give GradNorm time to stabilize
  gradient_clip_norm: 1.0  # Lower to 0.8 if seeing loss spikes after warmup
  mixed_precision: false  # FP32 only
  gradient_accumulation_steps: 8  # Effective batch size 32
  freeze_backbone: false
  freeze_backbone_epochs: 0
  early_stopping_patience: 12
  early_stopping_metric: "val_loss"

# Loss Configuration
# Trimmed to active heads in create_loss_fn: detection -> objectness,
# box_regression -> box, plus the two temporal heads required when
# temporal_supervision=true. Inactive semantic heads (motion, therapy_state,
# roi_priority, scene_description, ocr, scene_graph, sound_events,
# personalization, predictive_alerts) come back when create_loss_fn wires them.
loss:
  use_gradnorm: true
  gradnorm_alpha: 1.5
  gradnorm_update_interval: 100
  temporal_supervision: true
  loss_weights:
    objectness: 1.0
    classification: 1.2
    box: 3.0  # Reduced from 5.0 - still important but not dominant
    distance: 0.7  # Accessibility-critical
    urgency: 1.5  # Accessibility-critical
    temporal_consistency: 0.4
    flicker: 0.3

# Validation Configuration
validation:
  val_check_interval: 0.5
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"

# Checkpointing
checkpoint:
  save_dir: "checkpoints/t5_temporal"
  save_last: true
  save_every_n_epochs: 10

# Logging
logging:
  log_dir: "logs/t5_temporal"
  log_every_n_steps: 50
  tensorboard: true

# Target: mAP@0.5 >= 0.5 via inference sweep only (no retraining).
target_metrics:
  mAP_50: 0.5

dataset:
  dataset_id: "maxsight-coco-cleaned"
  dataset_version: "v1"
  require_match: false

# Device
device: "auto"
seed: 42
