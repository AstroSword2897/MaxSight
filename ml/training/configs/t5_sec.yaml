# MaxSight Training Configuration: T5 safety-focused (reference only; do not retrain).
# Same T5 architecture as t5_temporal; loss weights tuned for safety-critical detection.
# Target: mAP@0.5 >= 0.5 via inference sweep only.

schema_version: "1.0.0"

model:
  tier: "T5_TEMPORAL"
  num_classes: 622  # Full COCO_BASE + ACCESSIBILITY vocabulary
  use_se_attention: true
  use_cbam_attention: true
  use_hybrid_backbone: true
  use_dynamic_conv: true
  use_cross_task_attention: true
  use_cross_modal_attention: true
  use_temporal_modeling: true
  use_retrieval: true

data:
  train_annotation_file: "datasets/cleaned_splits/maxsight_train.json"
  val_annotation_file: "datasets/cleaned_splits/maxsight_val.json"
  test_annotation_file: "datasets/cleaned_splits/maxsight_test.json"
  image_dir: "datasets/coco_raw"
  audio_dir: null
  batch_size: 4
  num_workers: 8
  pin_memory: true
  max_objects: 10
  condition_mode: null
  tag_lighting_metadata: true
  lighting_pixel_augmentation: false
  use_weighted_sampling: false

training:
  num_epochs: 150
  learning_rate: 7.5e-5
  weight_decay: 0.05
  optimizer: "AdamW"
  scheduler_type: "cosine"
  min_lr: 1e-6
  warmup_epochs: 20
  gradient_clip_norm: 1.0
  mixed_precision: false
  gradient_accumulation_steps: 8
  freeze_backbone: false
  freeze_backbone_epochs: 0
  early_stopping_patience: 12
  early_stopping_metric: "val_loss"

# Trimmed to active heads. Safety-tuned weights: heavier urgency/distance.
loss:
  use_gradnorm: true
  gradnorm_alpha: 1.5
  gradnorm_update_interval: 100
  temporal_supervision: true
  loss_weights:
    objectness: 1.0
    classification: 1.2
    box: 3.0
    distance: 0.8
    urgency: 1.8
    temporal_consistency: 0.5
    flicker: 0.4

validation:
  val_check_interval: 0.5
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"

checkpoint:
  save_dir: "checkpoints/t5_sec"
  save_last: true
  save_every_n_epochs: 10

logging:
  log_dir: "logs/t5_sec"
  log_every_n_steps: 50
  tensorboard: true

target_metrics:
  mAP_50: 0.5

dataset:
  dataset_id: "maxsight-coco-cleaned"
  dataset_version: "v1"
  require_match: false

device: "auto"
seed: 42
