name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install linting tools only
        run: |
          pip install --upgrade pip
          pip install flake8 mypy black
      - name: Lint with flake8 (critical errors only)
        run: |
          flake8 ml/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Lint with flake8 (warnings - non-blocking)
        run: |
          flake8 ml/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      - name: Check formatting with black (non-blocking)
        run: |
          black --check ml/ scripts/
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install dependencies (CPU-only PyTorch for CI)
        run: |
          pip install --upgrade pip
          # Install CPU-only PyTorch to save space (tests don't need GPU)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install other dependencies
          pip install --no-deps -r requirements.txt || pip install -r requirements.txt
          # Reinstall with dependencies if needed
          pip install numpy pandas pillow scipy scikit-learn matplotlib tqdm pytest
      - name: Run tests
        run: |
          echo "Running pytest..."
          pytest tests/ -v --tb=short --maxfail=5
      - name: Validate train loop observability contracts
        run: python scripts/infra/validate_train_loop_contracts.py

  sagemaker_ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install minimal deps for ops dry-run
        run: |
          pip install --upgrade pip
          pip install boto3 pyyaml pytest
      - name: SageMaker integration tests (offline)
        run: pytest tests/test_sagemaker_integration.py tests/test_production_remediation.py -v --tb=short
      - name: Validate infra JSON stubs
        run: python scripts/infra/validate_infra_stubs.py
      - name: Validate train loop observability contracts
        run: python scripts/infra/validate_train_loop_contracts.py
      - name: SageMaker ops launcher tests (offline)
        run: pytest tests/test_ops_launchers.py -v --tb=short
      - name: Model package group script (dry-run)
        run: |
          python scripts/ops/create_model_package_group.py \
            --name ci-placeholder-model-group \
            --region us-east-1 \
            --dry-run
      - name: Ops launcher dry-run (no AWS submit)
        env:
          MAXSIGHT_S3_BUCKET: ci-dry-run-placeholder
          SAGEMAKER_ROLE_ARN: arn:aws:iam::123456789012:role/CIPlaceholderSageMakerRole
          MAXSIGHT_SKIP_ROLE_ASSERT: "1"
          SM_SUBNET_IDS: subnet-aaa,subnet-bbb
          SM_SECURITY_GROUP_IDS: sg-ccc
        run: |
          python scripts/ops/sagemaker_train.py \
            --bucket "$MAXSIGHT_S3_BUCKET" \
            --role "$SAGEMAKER_ROLE_ARN" \
            --config ml/training/configs/t0_baseline.yaml \
            --dry-run
          python scripts/ops/sagemaker_deploy.py deploy \
            --bucket "$MAXSIGHT_S3_BUCKET" \
            --role "$SAGEMAKER_ROLE_ARN" \
            --model-data s3://$MAXSIGHT_S3_BUCKET/maxsight/output/model.tar.gz \
            --endpoint ci-dry-run \
            --skip-registry-check \
            --dry-run

